<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel — Vélore Pay</title>
  <meta name="theme-color" content="#17140F" />
  <link rel="icon" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="barra">
    <a class="marca" href="./" aria-label="Abrir o site">
      <img src="assets/logo.jpg" alt="" width="36" height="36" />
      <span>Vélore Pay <em>Painel</em></span>
    </a>
    <div class="conta" id="conta" hidden>
      <span id="userEmail"></span>
      <button type="button" class="secundario" id="btnSair">Sair</button>
    </div>
  </header>

  <main class="adm">
    <!-- login -->
    <form class="entrar" id="telaLogin">
      <h1>Entrar no painel</h1>
      <label class="campo">E-mail<input id="loginEmail" type="email" autocomplete="username" required /></label>
      <label class="campo">Senha<input id="loginSenha" type="password" autocomplete="current-password" required /></label>
      <button class="acao" type="submit">Entrar</button>
      <p class="msg" id="msgLogin" role="status"></p>
    </form>

    <div id="telaPainel" hidden>
      <!-- cotação -->
      <form class="bloco" id="formCot">
        <div class="cabeca">
          <h1>Cotação</h1>
          <p class="sub" id="ultima"></p>
        </div>

        <div class="cotas">
          <label class="cota">
            <span class="cota-nome">Dólar</span>
            <span class="cota-explica">Quanto custa US$ 1 em reais</span>
            <span class="cota-campo"><i>R$</i><input id="usd" inputmode="decimal" autocomplete="off" required /></span>
          </label>
          <label class="cota">
            <span class="cota-nome">Guarani</span>
            <span class="cota-explica">Quantos guaranis por R$ 1</span>
            <span class="cota-campo"><i>Gs.</i><input id="pyg" inputmode="decimal" autocomplete="off" required /></span>
          </label>
        </div>

        <p class="previa" id="previa"></p>
        <button class="acao" type="submit" id="btnCot">Publicar cotação</button>
        <p class="msg" id="msgCot" role="status"></p>
      </form>

      <!-- histórico -->
      <section class="bloco">
        <h2>Alterações recentes</h2>
        <table class="hist">
          <thead><tr><th>Quando</th><th>Dólar</th><th>Guarani</th><th>Quem</th></tr></thead>
          <tbody id="hist"></tbody>
        </table>
      </section>

      <!-- contato -->
      <form class="bloco" id="formGeral">
        <h2>Atendimento</h2>
        <div class="dupla">
          <label class="campo">WhatsApp que recebe os pedidos<input id="whatsapp" inputmode="tel" placeholder="55 75 99999-9999" required /></label>
          <label class="campo">Segundo WhatsApp (opcional)<input id="whatsapp2" inputmode="tel" /></label>
        </div>
        <label class="campo">Aviso no topo do site<input id="aviso" placeholder="Deixe em branco para não mostrar" /></label>
        <fieldset class="horas">
          <legend>Horários de atendimento</legend>
          <div id="horasEdit"></div>
        </fieldset>
        <button class="acao" type="submit">Salvar atendimento</button>
        <p class="msg" id="msgGeral" role="status"></p>
      </form>
    </div>

    <section class="bloco" id="telaSemAcesso" hidden>
      <h1>Sem permissão</h1>
      <p class="sub">Este e-mail não está liberado para alterar a cotação. Peça ao responsável para liberar o acesso.</p>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
